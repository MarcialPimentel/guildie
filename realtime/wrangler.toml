# Guildie's realtime service on Cloudflare (docs/realtime-setup.md). Deployed by .github/workflows/deploy.yml
# on every merge to main once the CLOUDFLARE_* secrets are set. The shared secret is a Worker secret
# (REALTIME_SECRET), never in this file.
name = "guildie-realtime"
main = "src/worker.js"
compatibility_date = "2025-04-01"

[vars]
ALLOWED_ORIGINS = "https://marz.gg,https://www.marz.gg"
CAPACITY = "30"

[[durable_objects.bindings]]
name = "QUARTER"
class_name = "QuarterRoom"

# The free plan only has SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuarterRoom"]
