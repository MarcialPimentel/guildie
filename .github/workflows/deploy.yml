# Checks every pull request, and on every merge to main deploys Guildie to marz.gg over FTPS.
#
#   checks  (PRs and main): PHP syntax, content validator, API smoke test against a throwaway
#           MySQL, web client build (TypeScript), realtime room tests, browser test (Playwright,
#           phone + desktop, with a local realtime room server) -> downloadable packages (Artifacts)
#   deploy  (main only):    uploads the server code into guildie-private/, then the game into
#           public_html/games/guildie/. The server applies new migrations itself.
#   realtime (main only):   builds the living city's realtime rooms (realtime/) as a Docker image on GitHub
#           Packages, then restarts them on the DigitalOcean droplet (docs/realtime-setup.md). The
#           restart is skipped until its secrets are set; it never blocks the game deploy.
#
# Two SiteGround FTP accounts, each limited to the folder it needs (see docs/deploy.md):
#   server-code account  home = the guildie-private/ folder        -> server code
#   game-files account   home = public_html/games/                 -> the game
# Account names and passwords are only in the repository secrets and Marz's private notes.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD               (server-code account)
#   FTP_PUBLIC_USERNAME, FTP_PUBLIC_PASSWORD             (game-files account, same host)
# Until all five are set, checks still run and the upload is skipped.
#   DROPLET_HOST, DROPLET_SSH_KEY   (the realtime job: the same values as in the hormigas repo)
name: Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  # Folders relative to each FTP account's home folder.
  PRIVATE_DIR: ./          # the server-code account's home IS guildie-private/
  PUBLIC_DIR: guildie/     # the game-files account's home is public_html/games/

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: guildie_test
          MYSQL_USER: guildie
          MYSQL_PASSWORD: localtestpw
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring, json

      - name: PHP syntax
        run: |
          for f in $(find server tools -name '*.php'); do php -l "$f" > /dev/null || exit 1; done
          echo "All PHP files OK"

      - name: Content validator
        run: python3 tools/validate_content.py

      - name: Migration check (numbering, "-- END NNN" markers, no edits to applied files)
        run: |
          git fetch --no-tags --depth=1 origin main
          python3 tools/check_migrations.py --base FETCH_HEAD

      - name: Start the API against a throwaway database (fast-pace content)
        run: |
          mkdir -p ci/private ci/www/games/guildie ci/content
          ln -s "$PWD/server/app" ci/private/app
          ln -s "$PWD/server/api" ci/www/games/guildie/api
          cp content/*.json ci/content/
          python3 - <<'EOF'
          import json
          p = 'ci/content/economy.json'; d = json.load(open(p))
          d['pace']['time_multiplier'] = 0.05
          # Deterministic tests: no random surprises (#48) and no random price movement (#45).
          for k in ('rich_find_chance', 'rare_find_chance', 'bonus_craft_chance'):
              d['surprises'][k] = 0
          for c in d['progression']['colours']:   # quality (0.18.0): each colour makes exactly its minimum
              c['quality_up'] = 0
          d['market']['noise_per_hour'] = 0
          d['market']['reversion_per_hour'] = 0   # Guild Week / event prices don't move items during tests
          json.dump(d, open(p, 'w'), indent=1)
          p = 'ci/content/orders.json'; o = json.load(open(p))
          o['settings']['rare_recipe_chance'] = {k: 1 for k in o['settings']['rare_recipe_chance']}   # tests always see one (#49)
          json.dump(o, open(p, 'w'), indent=1)
          EOF
          cat > ci/private/config.php <<'EOF'
          <?php
          return ['db' => ['host' => '127.0.0.1', 'name' => 'guildie_test', 'user' => 'guildie', 'pass' => 'localtestpw', 'charset' => 'utf8mb4'],
                  'tick_interval_seconds' => 300, 'debug' => true, 'feedback_key' => 'ci-feedback-key',
                  'realtime_url' => 'ws://127.0.0.1:8788', 'realtime_secret' => 'ci-realtime-secret-0123456789'];
          EOF
          export GUILDIE_PRIVATE="$PWD/ci/private" GUILDIE_CONTENT="$PWD/ci/content" GUILDIE_MIGRATIONS="$PWD/server/migrations"
          echo "GUILDIE_PRIVATE=$GUILDIE_PRIVATE" >> "$GITHUB_ENV"
          echo "GUILDIE_CONTENT=$GUILDIE_CONTENT" >> "$GITHUB_ENV"
          echo "GUILDIE_MIGRATIONS=$GUILDIE_MIGRATIONS" >> "$GITHUB_ENV"
          # Several workers so the smoke test can send requests at the same moment (race tests).
          (cd ci/www && PHP_CLI_SERVER_WORKERS=4 nohup php -S 127.0.0.1:8080 -t . > ../php-server.log 2>&1 &)
          for i in $(seq 20); do curl -s -o /dev/null http://127.0.0.1:8080/ && break; sleep 0.5; done
          # The first request applies all migrations to the empty database.
          out=$(curl -s "http://127.0.0.1:8080/games/guildie/api/index.php?action=ping" || true)
          echo "$out"
          if ! echo "$out" | grep -q '"ok":true'; then
            echo "::error title=API did not start::$(echo "$out" | head -c 600) | $(tail -3 ci/php-server.log | tr '\n' ' ')"
            exit 1
          fi

      - name: API smoke test
        run: python3 tools/smoke_test.py http://127.0.0.1:8080/games/guildie/api/index.php --tick "php server/app/tick.php --force" --feedback-key ci-feedback-key --player-tool "php tools/test_player.php"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the web client (type check + Vite)
        working-directory: client
        run: |
          npm ci --no-audit --no-fund
          GUILDIE_BUILD="$(tr -d '[:space:]' < ../VERSION) (build ${{ github.run_number }})" npm run build
          # Serve it next to the API, exactly like the live folder layout.
          cp -r dist/. ../ci/www/games/guildie/

      - name: Realtime rooms (rule tests, then a local room server for the browser test)
        working-directory: realtime
        run: |
          npm ci --no-audit --no-fund
          npm test
          (REALTIME_SECRET=ci-realtime-secret-0123456789 PORT=8788 nohup node src/server.mjs > ../ci/realtime.log 2>&1 &)
          for i in $(seq 20); do curl -s http://127.0.0.1:8788/ && break; sleep 0.5; done

      - name: Browser test (plays the real game against the API, phone + desktop)
        working-directory: client
        run: |
          npx playwright install --with-deps chromium > /dev/null
          GUILDIE_URL=http://127.0.0.1:8080/games/guildie/ npx playwright test

      - name: Build the upload packages
        run: BUILD_NUMBER=${{ github.run_number }} tools/package.sh

      - name: Server log (on failure)
        if: failure()
        run: |
          cat ci/php-server.log || true
          cat ci/realtime.log || true

      - name: Browser test traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: client/test-results/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: guildie-packages
          path: dist/guildie-*.zip
          retention-days: 14

  deploy:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check FTP settings
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PUBLIC_USERNAME: ${{ secrets.FTP_PUBLIC_USERNAME }}
          FTP_PUBLIC_PASSWORD: ${{ secrets.FTP_PUBLIC_PASSWORD }}
        run: |
          missing=""
          for n in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_PUBLIC_USERNAME FTP_PUBLIC_PASSWORD; do
            [ -z "${!n}" ] && missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Upload skipped: these secrets aren't set yet:$missing. See docs/deploy.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: guildie-packages
          path: dist

      - name: Unpack
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p upload/private upload/public
          unzip -q dist/guildie-private-*.zip -d upload/private
          unzip -q dist/guildie-public-*.zip -d upload/public
          ls upload/private upload/public

      # Server first, so the new game never talks to old server code.
      - name: Upload server code to guildie-private/
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: upload/private/
          server-dir: ${{ env.PRIVATE_DIR }}
          # Never upload or delete the server's real config.php (top of guildie-private/).
          # Only that exact path: app/lib/config.php is code and must be uploaded.
          exclude: |
            config.php

      - name: Upload the game to public_html/games/guildie/
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_PUBLIC_USERNAME }}
          password: ${{ secrets.FTP_PUBLIC_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: upload/public/
          server-dir: ${{ env.PUBLIC_DIR }}

      # Fail the run unless the live site really is the new build: the server reports the new build and
      # database version (the ping also applies any new migrations), and the game page serves the new client.
      - name: Live check (ping + game page)
        if: steps.check.outputs.ready == 'true'
        run: |
          set -u
          GAME=https://marz.gg/games/guildie
          BUILD=$(grep -o "'.*'" upload/private/app/version.php | tr -d "'")
          SCHEMA=$(ls upload/private/migrations | sed -n 's/^\([0-9][0-9][0-9]\)_.*/\1/p' | sort | tail -1 | sed 's/^0*//')
          ASSET=$(grep -o 'assets/index-[^"]*\.js' upload/public/index.html | head -1)
          echo "Expecting build '$BUILD', schema $SCHEMA, client $ASSET"
          ok=""
          for i in $(seq 20); do
            out=$(curl -s --max-time 20 "$GAME/api/index.php?action=ping&v=$RANDOM" || true)
            if echo "$out" | python3 -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('ok') and d['data']['build']=='$BUILD' and int(d['data']['schema'])==$SCHEMA else 1)" 2>/dev/null; then
              ok=1; break
            fi
            echo "Not live yet (attempt $i): $(echo "$out" | head -c 200)"; sleep 15
          done
          if [ -z "$ok" ]; then
            echo "::error title=Live check failed::The server never reported build '$BUILD' with schema $SCHEMA. Last answer: $(echo "$out" | head -c 300)"
            exit 1
          fi
          fresh=$(curl -s --max-time 20 "$GAME/?v=$RANDOM" | grep -o 'assets/index-[^"]*\.js' | head -1)
          if [ "$fresh" != "$ASSET" ]; then
            echo "::error title=Live check failed::The game page serves '$fresh', expected '$ASSET'."
            exit 1
          fi
          served=$(curl -s --max-time 20 "$GAME/" | grep -o 'assets/index-[^"]*\.js' | head -1)
          if [ "$served" != "$ASSET" ]; then
            echo "::warning title=Stale cache::Players still get the old game page ('$served'). Flush the SiteGround cache: Site Tools > Speed > Caching > Dynamic Cache > Flush."
          fi
          echo "::notice::Live: build $BUILD, schema $SCHEMA, client $ASSET."

  # The living city's realtime rooms (docs/realtime-setup.md): a small container on the DigitalOcean droplet,
  # next to Hormigas, behind its Caddy (HTTPS). Cosmetic only (positions, waves, slaps), so a failure here
  # never blocks the game deploy; the game works without it.
  realtime:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: realtime
          push: true
          tags: |
            ghcr.io/marcialpimentel/guildie-realtime:latest
            ghcr.io/marcialpimentel/guildie-realtime:${{ github.sha }}
          cache-from: type=gha,scope=realtime
          cache-to: type=gha,scope=realtime,mode=max

      - name: Check droplet settings
        id: check
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          if [ -z "$DROPLET_HOST" ] || [ -z "$DROPLET_SSH_KEY" ]; then
            echo "::notice::Realtime restart skipped: DROPLET_HOST and DROPLET_SSH_KEY aren't set in this repo yet. See docs/realtime-setup.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restart the realtime rooms on the droplet
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /opt/hub
            if ! docker compose config --services | grep -qx guildie-realtime; then
              echo "guildie-realtime isn't in /opt/hub/docker-compose.yml yet (one-time setup: docs/realtime-setup.md). Skipping."
              exit 0
            fi
            docker compose pull guildie-realtime
            docker compose up -d guildie-realtime
            docker image prune -f
